# Render Blueprint — SIH26162 Industrial Thermal Intelligence (BACKEND ONLY)
#
# DEPLOYMENT ARCHITECTURE (changed):
#   GitHub ─┬─► Vercel  : frontend (apps/web, Next.js)  — SEE vercel.json
#           └─► Render  : backend (apps/api, FastAPI)  — THIS FILE
#                         └─► PostgreSQL + PostGIS
#
# The frontend is NO LONGER deployed by Render. It lives on Vercel, which reads
# `vercel.json` (rootDirectory: apps/web). This blueprint deploys ONLY the
# FastAPI backend as a Docker web service.
#
# Build context note: Render builds Docker from the REPOSITORY ROOT. The
# `dockerfilePath` below points at apps/api/Dockerfile, but every COPY in that
# Dockerfile is written relative to the repo root (e.g. `COPY apps/api/...`).
#
# IMPORTANT — Docker runtime requires a PAID Render plan:
#   Render's free tier only supports native (buildpack) runtimes; Docker web
#   services need at least the `starter` plan. Do not set `plan: free` here.
#
# IMPORTANT — the database MUST be PostgreSQL + PostGIS:
#   The initial migration emits `geometry(POINT, 4326)` columns and does NOT
#   run `CREATE EXTENSION postgis`. Render's native Postgres add-on does NOT
#   include PostGIS, so `alembic upgrade head` will fail against it. Provide a
#   PostGIS database (see DEPLOYMENT.md: a PostGIS Docker private service, or an
#   external PostGIS provider) and set DATABASE_URL / DATABASE_URL_SYNC below.

services:
  # --------------------------------------------------------------------------
  # FastAPI backend — Docker web service (the only thing this blueprint deploys)
  # --------------------------------------------------------------------------
  - type: web
    name: sih26162-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: starter          # Docker runtime is NOT available on the free plan
    # /api/v1/health returns 200 without a database (liveness probe). See
    # app/api/v1/endpoints/health.py — do NOT use /api/v1/health/ready here,
    # that one returns 503 until Postgres is reachable and would fail the check.
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production          # disables Swagger/ReDoc and demo seeding
      - key: LOG_FORMAT
        value: json                # structured logs in the Render dashboard
      - key: TRUST_PROXY_HEADERS
        value: "true"              # Render terminates TLS and sets X-Forwarded-*
      # CORS: the browser-facing origin(s) allowed to call this API.
      # Starlette matches these EXACTLY (no wildcards, because credentials are
      # allowed).
      #
      # CRITICAL FORMAT: this MUST be a JSON ARRAY string, NOT a comma-separated
      # list. pydantic-settings JSON-decodes complex env fields before the app's
      # comma-split validator runs, so a bare "https://a,https://b" string
      # crashes the service at startup (SettingsError). Use the JSON form below
      # and add your real Vercel domain as an array element.
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'
        # value: '["https://YOUR-VERCEL-APP.vercel.app","http://localhost:3000"]'
      # ---- Database (PostgreSQL + PostGIS required) -----------------------
      # DATABASE_URL uses the ASYNC driver (+asyncpg) — the app talks to it via
      # asyncpg. DATABASE_URL_SYNC uses the SYNC driver (psycopg) — Alembic needs
      # it (Alembic cannot drive asyncpg). Point both at your PostGIS instance.
      # Example for a Render PostGIS private service named "postgis":
      # - key: DATABASE_URL
      #   value: postgresql+asyncpg://postgres:postgres@postgis:5432/sih26162_thermal
      # - key: DATABASE_URL_SYNC
      #   value: postgresql://postgres:postgres@postgis:5432/sih26162_thermal
      # (Leave unset to deploy the container WITHOUT a DB — /api/v1/health still
      #  returns 200, but /api/v1/health/ready will be 503 and alembic upgrade
      #  head at boot will fail until these are provided.)

  # --------------------------------------------------------------------------
  # (Optional) PostGIS database as a Docker private service.
  # Uncomment to provision the DB from this same blueprint. Requires a paid plan
  # too. A prebuilt PostGIS image is used; Render volume gives it persistence.
  # --------------------------------------------------------------------------
  # - type: pserv
  #   name: postgis
  #   runtime: docker
  #   dockerfilePath: deployments/postgis/Dockerfile   # see DEPLOYMENT.md
  #   plan: starter
  #   disk:
  #     name: postgis-data
  #     mountPath: /var/lib/postgresql/data
  #     sizeGB: 10
