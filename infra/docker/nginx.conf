# infra/docker/nginx.conf — Minimal reverse proxy (optional `proxy` profile)
# Routes the frontend at `/`, the API under `/api/`, and a health alias at
# `/healthz`. Intended for a production-like single-host deployment behind the
# `nginx` service in docker-compose.yml.

events {
  worker_connections 1024;
}

http {
  upstream web {
    server web:3000;
  }
  upstream api {
    server api:8000;
  }

  server {
    listen 80;
    server_name _;

    # Frontend (Next.js standalone)
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI backend
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Liveness alias
    location /healthz {
      proxy_pass http://api/api/v1/health;
    }
  }
}
