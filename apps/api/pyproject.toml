[project]
name = "sih26162-thermal-api"
version = "0.1.0"
description = "AI-Based Detection and Classification of Industrial Fires — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    # Lets the suite run against SQLite instead of requiring a live PostGIS.
    "aiosqlite>=0.19",
]
dev = [
    "ruff>=0.3.0",
    "black>=24.0",
    "mypy>=1.9",
]

[project.scripts]
thermal-api = "app.main:create_app"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

# Flat layout (package is `app/` at the project root, not under src/). Modern
# setuptools will not auto-discover packages for a flat layout and `pip install
# -e .` fails ("setuptools will not proceed with this build"). Declare it
# explicitly so the editable install — used by the Dockerfile and local venv —
# works deterministically.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]
ignore = [
    # B008 flags `db: AsyncSession = Depends(get_db)` as "function call in a
    # default argument". In FastAPI that *is* the dependency-injection API —
    # there is no alternative spelling. Suppressed once here rather than
    # trailing a `# noqa: B008` on every endpoint signature.
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
